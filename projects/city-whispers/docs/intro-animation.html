<!doctype html>
<!--
  City Whispers — social intro animation (9:16, ~35s, one-shot)

  HOW TO RECORD:
  1. npm run dev, then open http://localhost:5180/docs/intro-animation.html in Chrome
     (the phone embeds the app from the same server, so the dev server must be running)
  2. Cmd+Shift+5 → record selected portion → drag over the stage
  3. One take = hook → phone demo → CTA. The page reloads itself at the
     end so the next take starts fresh.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Whispers — intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #23211d;
    --ink:   #ece8db;
    --sage:  #9db897;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; overflow: hidden; }

  /* 9:16 stage, scaled to fit whatever window it's in */
  #stage {
    width: 1080px; height: 1920px;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(var(--fit, 0.4));
    background:
      radial-gradient(ellipse 90% 55% at 50% 30%, #2c2922 0%, var(--paper) 70%),
      var(--paper);
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
  }

  .star {
    position: absolute; border-radius: 50%;
    background: var(--ink); opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.06; }
    50%      { opacity: 0.35; }
  }

  .scene {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; transform: translateY(26px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
  }
  .scene.show { opacity: 1; transform: translateY(0); }

  /* Scene 1: hook (two beats) */
  #s1, #s1b { padding: 0 100px; text-align: center; }
  #s1 h1, #s1b h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 110px; font-weight: 600; line-height: 1.25;
  }
  #s1b h1 { color: var(--sage); }

  /* Scene 2: the real app in a phone, nudged down to make room
     for the caption that sits above it */
  #s2.scene { padding-top: 130px; transform: translateY(60px) scale(0.96); }
  #s2.scene.show { transform: translateY(0) scale(1); }
  #phone {
    width: 770px; height: 1640px;
    border-radius: 96px;
    background: #1a1916;
    padding: 22px;
    box-shadow:
      0 0 0 3px rgba(236,232,219,0.12),
      0 50px 120px rgba(0,0,0,0.6);
    position: relative;
  }
  #phone .screen {
    width: 100%; height: 100%;
    border-radius: 76px; overflow: hidden;
    position: relative; background: #fffdf7;
  }
  #phone iframe {
    width: 363px; height: 798px;
    transform: scale(2); transform-origin: 0 0;
    border: 0; pointer-events: none;
  }
  #phone .island {
    position: absolute; top: 36px; left: 50%;
    transform: translateX(-50%);
    width: 126px; height: 40px; border-radius: 20px;
    background: #1a1916; z-index: 2;
  }

  /* caption sits above the phone, inside the scene */
  #caption {
    position: absolute; left: 0; right: 0; top: 64px;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-size: 58px; color: var(--sage);
    opacity: 0; transition: opacity 0.9s ease;
    pointer-events: none;
  }
  #caption.show { opacity: 1; }

  /* Scene 3: CTA */
  #s5 { text-align: center; }
  #s5 .logo { width: 150px; height: 150px; margin: 0 auto 36px; }
  #s5 .logo svg { width: 100%; height: 100%; }
  #s5 .name {
    font-family: 'Dancing Script', cursive;
    font-size: 130px; font-weight: 700;
  }
  #s5 .tagline {
    margin-top: 26px;
    font-family: 'Dancing Script', cursive;
    font-size: 64px; font-weight: 600; color: var(--sage);
  }
  #s5 .url {
    margin-top: 30px; font-size: 44px; letter-spacing: 0.06em;
    color: var(--sage); font-weight: 500;
  }

  /* tap-to-start gate: browsers only allow audio after a user gesture */
  #start-gate {
    position: absolute; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: var(--paper); cursor: pointer;
    font-family: 'Dancing Script', cursive;
    font-size: 72px; color: var(--sage);
    transition: opacity 0.5s ease;
  }
  #start-gate.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">

  <div id="start-gate">tap to begin&nbsp;&nbsp;✦</div>

  <!-- scene 1: hook, two beats -->
  <div class="scene" id="s1">
    <h1>Ever miss the city<br>you left behind?</h1>
  </div>
  <div class="scene" id="s1b">
    <h1>Someone out there<br>misses it too.</h1>
  </div>

  <!-- scene 2: the real app in a phone -->
  <div class="scene" id="s2">
    <div id="phone">
      <div class="island"></div>
      <div class="screen">
        <iframe id="app" src="/?demo=1&map=1&theme=day" title="City Whispers demo"></iframe>
      </div>
    </div>
    <div id="caption"></div>
  </div>

  <!-- scene 3: CTA -->
  <div class="scene" id="s5">
    <div>
      <div class="logo"></div>
      <div class="name">City Whispers</div>
      <div class="tagline">Leave a memory, wherever you are.</div>
      <div class="url">city-whispers.app</div>
    </div>
  </div>

</div>
<script>
  // logo SVG for CTA
  const logoSVG =
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="color:#92c4a2">' +
    '<rect x="2" y="3" width="20" height="18" rx="1.5" fill="currentColor" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.2 1.6"/>' +
    '<rect x="5" y="6" width="14" height="12" rx="0.8" fill="#FFF8F0"/>' +
    '<path fill="none" stroke="currentColor" stroke-width="1.2" d="M12 7 C14.6 7 16 9.2 16 10.8 C16 13.4 12 16.6 12 16.6 C12 16.6 8 13.4 8 10.8 C8 9.2 9.4 7 12 7 Z"/>' +
    '<circle cx="12" cy="10.7" r="1.6" fill="currentColor"/>' +
    '</svg>'
  document.querySelector('#s5 .logo').innerHTML = logoSVG

  // sprinkle stars
  const stage = document.getElementById('stage')
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div')
    s.className = 'star'
    const size = 2 + Math.random() * 4
    s.style.cssText = 'left:' + (Math.random() * 1080) + 'px; top:' + (Math.random() * 1920) + 'px;' +
      'width:' + size + 'px; height:' + size + 'px;' +
      'animation-delay:' + (Math.random() * 4) + 's;' +
      'animation-duration:' + (3 + Math.random() * 3) + 's;'
    stage.appendChild(s)
  }

  // scale the 1080×1920 stage to fit the window
  function fit() {
    const k = Math.min(innerWidth / 1080, innerHeight / 1920)
    stage.style.setProperty('--fit', k)
  }
  fit()
  addEventListener('resize', fit)

  /* ── timeline ── the story in four beats, with voiceover + ambient
     music. A tap on the start gate begins the take (audio needs a
     user gesture). NOTE: macOS Cmd+Shift+5 records the mic, not system
     audio — either play through speakers and record the mic, or use a
     loopback device (BlackHole) / QuickTime for clean system audio.
     0.5–3.9   hook: "Ever miss the city you left behind?"
     4.2–7.6   turn: "Someone out there misses it too."
     8.0       phone in + demo start requested; the app replies with
               'cw-demo-began' once the map is loaded and the camera
               actually moves — all later cues are timed from that.
     demo:     globe of real stamp clusters revolves (day) → Mumbai →
               New York City → Asheville, one card each with a like
               tapped → glide to Paris (kept empty), pin dropped, form
               prefilled, memory typed and sent → "you're the first to
               whisper here" → see it bloom → postcard pops and fades
               → pull back → night falls ~53s in → dark revolve
     +1.2      caption: every stamp is a memory
     +31.0     caption: leave one of your own (during the pin + form beat)
     +54.2     caption: the map follows the sky (during the night spin)
     +59.4     phone out
     +60.4     CTA: logo + "Leave a memory, wherever you are." + url
     +67.8     reload for next take                                    */
  const at = (s, fn) => setTimeout(fn, s * 1000)
  const show = (id) => document.getElementById(id).classList.add('show')
  const hide = (id) => document.getElementById(id).classList.remove('show')
  const caption = (text) => {
    const el = document.getElementById('caption')
    el.innerHTML = text
    el.classList.add('show')
  }

  /* ── voiceover: a warm, unhurried voice via the browser's own speech ── */
  const VO_LINES = [
    'Ever miss the city you left behind?',
    'Someone out there misses it too.',
    'Every stamp on this map is a memory someone left behind.',
    'From the streets of Mumbai,',
    'to the city where the dreams came true,',
    'to the place where someone found love.',
    'And when you are ready, leave one of your own.',
    'Your memory lives on the map now.',
    'The map follows the sky.',
    'City Whispers. Leave a memory, wherever you are.',
  ]
  let voVoice = null
  function pickVoice() {
    const voices = speechSynthesis.getVoices()
    // warmest English voices first; fall back to any English one
    const wanted = ['Samantha', 'Moira', 'Karen', 'Tessa', 'Google UK English Female', 'Microsoft Aria']
    voVoice = wanted.map((n) => voices.find((v) => v.name.includes(n))).find(Boolean)
      || voices.find((v) => v.lang.startsWith('en')) || null
  }
  speechSynthesis.onvoiceschanged = pickVoice
  pickVoice()
  function say(lineNo) {
    const u = new SpeechSynthesisUtterance(VO_LINES[lineNo - 1])
    if (voVoice) u.voice = voVoice
    u.rate = 0.92   // unhurried
    u.pitch = 1.05  // a touch warmer
    u.volume = 1
    speechSynthesis.speak(u)
  }

  /* ── background music: a soft ambient pad from the Web Audio API ── */
  let audioCtx = null
  function startMusic() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    const master = audioCtx.createGain()
    master.gain.value = 0.05 // stays well under the voice
    master.connect(audioCtx.destination)
    // gentle I–vi–IV–V in F major, one slow chord every 4 seconds
    const chords = [
      [174.61, 220.0, 261.63],  // F
      [146.83, 174.61, 220.0],  // Dm
      [116.54, 174.61, 233.08], // Bb
      [130.81, 196.0, 261.63],  // C
    ]
    let step = 0
    const playChord = () => {
      const notes = chords[step % chords.length]
      step++
      const now = audioCtx.currentTime
      notes.forEach((freq) => {
        const osc = audioCtx.createOscillator()
        const g = audioCtx.createGain()
        osc.type = 'sine'
        osc.frequency.value = freq
        // slow swell in and out so the chords breathe
        g.gain.setValueAtTime(0, now)
        g.gain.linearRampToValueAtTime(1, now + 1.6)
        g.gain.linearRampToValueAtTime(0, now + 4.4)
        osc.connect(g); g.connect(master)
        osc.start(now); osc.stop(now + 4.6)
      })
    }
    playChord()
    setInterval(playChord, 4000)
  }

  /* the take starts on a tap — browsers need one gesture before audio */
  document.getElementById('start-gate').addEventListener('click', () => {
    document.getElementById('start-gate').classList.add('gone')
    startMusic()
    startTake()
  }, { once: true })

  function startTake() {
    at(0.5,  () => show('s1'))
    at(0.7,  () => say(1))
    at(3.9,  () => hide('s1'))
    at(4.2,  () => show('s1b'))
    at(4.4,  () => say(2))
    at(7.6,  () => hide('s1b'))
    // the app attaches its listener only once its data has loaded, so a
    // single message can be missed — repeat until the app confirms
    let startPing = null
    at(8.0,  () => {
      show('s2')
      startPing = setInterval(() =>
        document.getElementById('app').contentWindow.postMessage('cw-demo-start', '*'), 500)
    })

    // everything after this is timed from the app's "camera is moving"
    // signal, so captions and narration stay in sync however long the
    // map takes to load
    addEventListener('message', (e) => {
      if (e.data !== 'cw-demo-began') return
      clearInterval(startPing)
      at(1.2,  () => caption('every stamp is a memory&nbsp;&nbsp;✦'))
      at(1.3,  () => say(3))
      at(4.6,  () => hide('caption'))
      at(8.4,  () => say(4))
      at(16.7, () => say(5))
      at(24.0, () => say(6))
      at(31.0, () => caption('leave one of your own&nbsp;&nbsp;✎'))      // pin + form beat
      at(31.2, () => say(7))
      at(45.6, () => say(8))           // postcard pops after "see it bloom"
      at(49.4, () => hide('caption'))
      at(54.2, () => caption('the map follows the sky&nbsp;&nbsp;🌙'))   // night spin
      at(54.4, () => say(9))
      at(59.4, () => { hide('s2'); hide('caption') })
      at(60.4, () => show('s5'))
      at(61.0, () => say(10))
      at(67.8, () => location.reload())
    })
  }
</script>
</body>
</html>
